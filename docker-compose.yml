volumes:
  fetamilter-pg-v18:
  fetamilter-caddy-data:
  fetamilter-caddy-config:

services:
  fetamilter-db:
    container_name: fetamilter-db
    image: postgres:18.0
    environment:
      - POSTGRES_USER=fetamilter
      - POSTGRES_PASSWORD=secret_crouton
      - POSTGRES_DB=fetamilter
      - PGDATA=/data/postgres
    volumes:
      - fetamilter-pg-v18:/data/postgres
    ports:
      - "5332:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
  fetamilter-proxy:
    container_name: fetamilter-proxy
    image: caddy:2.10-alpine
    ports:
      - 80:80
      - 443:443
    env_file:
      - .env
    volumes:
      - fetamilter-caddy-data:/data
      - fetamilter-caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
